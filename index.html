<title>Tap the Verity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* One-screen arcade: coins on top, bouncy smiley in the middle, grass below, shop slides up from the bottom with three tabs. Single dark look. */
:root{
  --sky-top:#3a2a6b; --sky-bot:#7b4fd1;
  --coin:#ffd400; --ink:#1d1230;
  --grass:#2fb85a; --grass-deep:#1f8a41; --text:#ffffff;
  --sheet:#241845; --row:#30235a; --go:#2fb85a; --muted:#a99bd6;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:linear-gradient(var(--sky-top),var(--sky-bot));
  color:var(--text);font-family:var(--display);
  overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button{font:inherit;color:inherit}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding-inline:16px;box-sizing:border-box}
.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.pill{background:rgba(0,0,0,.28);border:0;border-radius:999px;padding:9px 16px;font-size:1rem;cursor:pointer}
.pill.shop{background:var(--coin);color:var(--ink);font-size:1.15rem;box-shadow:0 4px 0 #b88a00}
.pill:focus-visible{outline:3px solid var(--text);outline-offset:2px}

.score{margin-top:64px;text-align:center;line-height:1;position:relative;z-index:1}
.score .num{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(3.2rem,13vw,5.5rem);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.score .num .c{width:.75em;height:.75em}
.score .label{margin-top:6px;font-size:1.05rem;opacity:.85}
.score.pop .num{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}

.play{position:relative;flex:1;width:100%;max-width:520px}
.ground{position:absolute;left:-50vw;right:-50vw;bottom:0;height:22%;background:linear-gradient(var(--grass),var(--grass-deep))}
.shadow{position:absolute;left:50%;bottom:calc(22% - 10px);width:150px;height:22px;margin-left:-75px;border-radius:50%;background:rgba(0,0,0,.3)}
.verity{position:absolute;left:50%;bottom:22%;width:min(52vw,210px);aspect-ratio:1;max-width:100%;transform:translateX(-50%);transform-origin:50% 100%;border:0;padding:0;background:none;cursor:pointer}
.verity:focus-visible{outline:4px dashed var(--text);outline-offset:8px;border-radius:50%}
.verity svg{width:100%;height:100%;display:block;overflow:visible}
.verity.jump{animation:jump .55s cubic-bezier(.3,.7,.4,1)}
.shadow.jump{animation:shrink .55s cubic-bezier(.3,.7,.4,1)}
@keyframes jump{
  0%{transform:translateX(-50%) translateY(0) scale(1.15,.82)}
  15%{transform:translateX(-50%) translateY(-20px) scale(.88,1.14)}
  45%{transform:translateX(-50%) translateY(-150px) scale(1,1)}
  80%{transform:translateX(-50%) translateY(-10px) scale(.94,1.06)}
  90%{transform:translateX(-50%) translateY(0) scale(1.14,.86)}
  100%{transform:translateX(-50%) translateY(0) scale(1,1)}
}
@keyframes shrink{45%{transform:scale(.5);opacity:.4}}
/* hats bounce a beat behind the head */
.verity.jump .hatlayer{animation:hatbob .55s ease-out}
@keyframes hatbob{15%{transform:translateY(10px)}45%{transform:translateY(-14px)}80%{transform:translateY(4px)}}
.hatlayer{transform-box:view-box}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .35s linear infinite}
@keyframes prop{50%{transform:scaleX(.08)}}

.plus{position:absolute;pointer-events:none;font-size:2.4rem;color:var(--coin);text-shadow:0 3px 0 var(--ink);animation:float .8s ease-out forwards;white-space:nowrap}
@keyframes float{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-110px) scale(1.2);opacity:0}}
.hint{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-size:1.3rem}

/* shop sheet */
.scrim{position:fixed;inset:0;background:rgba(10,5,25,.55);z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:86%;display:flex;flex-direction:column;background:var(--sheet);border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;max-width:560px;width:100%;margin-inline:auto}
.sheet-head h2{margin:0;font-size:1.8rem;font-weight:400}
.wallet{display:flex;align-items:center;gap:6px;font-size:1.2rem;color:var(--coin);font-variant-numeric:tabular-nums}
.wallet .c{width:1.1em;height:1.1em}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:16px;max-width:560px;width:100%;margin:0 auto 12px;box-sizing:border-box}
.tab{border:0;background:none;border-radius:12px;padding:9px 6px;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--row);color:var(--text)}
.tab:focus-visible{outline:3px solid var(--text)}
.list{overflow-y:auto;display:grid;gap:10px;max-width:560px;width:100%;margin:0 auto;padding-bottom:4px}
.item{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:12px;background:var(--row);border-radius:18px;padding:10px 12px}
.item.on{box-shadow:inset 0 0 0 3px var(--coin)}
.item svg{width:84px;height:84px;display:block;overflow:visible}
.item .info{min-width:0}
.item .name{font-size:1.35rem;line-height:1.1}
.item .per{font-size:.95rem;color:var(--muted);margin-top:2px}
.item .per b{color:var(--coin);font-weight:400}
.act{border:0;border-radius:14px;padding:10px 14px;font-size:1.05rem;cursor:pointer;min-width:96px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.act .c{width:1em;height:1em}
.act.buy{background:var(--coin);color:var(--ink);box-shadow:0 3px 0 #b88a00}
.act.buy:disabled{background:#4a3d78;color:var(--muted);box-shadow:none;cursor:default}
.act.use{background:var(--go);color:#fff;box-shadow:0 3px 0 var(--grass-deep)}
.act.using{background:transparent;color:var(--coin);cursor:default}
.act.off{background:rgba(0,0,0,.3);color:var(--text)}
.act:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.close{width:100%;max-width:560px;margin:12px auto 0;display:block}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.act.del{background:none;color:var(--muted);font-size:.9rem;padding:4px 8px;min-width:0}
.list .sub-head{font-size:1rem;color:var(--muted);margin:6px 4px 0;letter-spacing:.06em}

/* mask maker */
.editor{position:fixed;inset:0;z-index:8;background:var(--sheet);display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow-y:auto}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:520px}
.ed-head h2{margin:0;font-size:1.6rem;font-weight:400}
.cwrap{position:relative;width:min(84vw,360px,48vh);aspect-ratio:1;max-width:100%;flex:none}
.cwrap svg,.cwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.cwrap svg{overflow:visible}
.cwrap canvas{touch-action:none;cursor:crosshair}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--muted);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:4px solid var(--text);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px}
.tool{border:0;border-radius:12px;padding:9px 13px;font-size:1rem;cursor:pointer;background:var(--row);color:var(--text)}
.tool.ic{width:54px;height:54px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:16px}
.tool.ic svg{width:30px;height:30px}
.tool[aria-pressed="true"]{background:var(--coin);color:var(--ink)}
.tool:focus-visible,.sw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.ed-msg{margin:0;min-height:1.3em;color:var(--coin);font-size:1.05rem;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- play mode: idle life, expressions, reactions ---- */
.xo{display:none}
.verity svg[data-x] .face-base{display:none}
.verity svg[data-x="happy"] .x-happy{display:inline}
.verity svg[data-x="surprised"] .x-surprised{display:inline}
.verity svg[data-x="annoyed"] .x-annoyed{display:inline}
.verity svg[data-x="sleep"] .x-sleep{display:inline}
.verity svg[data-x="yawn"] .x-yawn{display:inline}
.verity svg[data-x="dizzy"] .x-dizzy{display:inline}
.verity svg[data-x="wince"] .x-wince{display:inline}
.verity svg[data-x="blep"] .x-blep{display:inline}
.verity .blink{transform-box:view-box;transform-origin:100px 80px;transition:transform .07s}
.verity svg.blinking .blink{transform:scaleY(.1)}
.verity .look{transition:transform .3s ease-out}
.verity .bodyg{transform-box:view-box;transform-origin:100px 196px;animation:breathe 3s ease-in-out infinite}
.verity svg[data-x="sleep"] .bodyg{animation-duration:5s}
@keyframes breathe{50%{transform:scale(1.015,1.035)}}
.verity svg{transform-origin:50% 100%}
.r-shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px) rotate(-2deg)}80%{transform:translateX(5px)}}
.r-squash{animation:squash .75s}
@keyframes squash{0%{transform:scale(1.28,.68)}40%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.95)}}
.r-squishx{animation:squishx .5s}
@keyframes squishx{30%{transform:scale(1.12,.9)}65%{transform:scale(.96,1.04)}}
.r-hop{animation:hop .8s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:scale(1.15,.85)}20%{transform:translateY(-30px) scale(.9,1.12)}45%{transform:translateY(-80px)}80%{transform:translateY(0) scale(1.12,.88)}}
.r-tilt-l{animation:tiltl .75s}
.r-tilt-r{animation:tiltr .75s}
@keyframes tiltl{25%{transform:rotate(-18deg)}55%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}}
@keyframes tiltr{25%{transform:rotate(18deg)}55%{transform:rotate(-8deg)}80%{transform:rotate(3deg)}}
.r-spin{animation:spin 1.6s ease-in-out;transform-origin:50% 55%}
@keyframes spin{10%{transform:translateX(-6px);filter:hue-rotate(90deg)}20%{transform:translateX(6px) rotate(40deg);filter:none}60%{transform:rotate(620deg) scale(1.08);filter:hue-rotate(200deg) saturate(1.6)}70%{filter:none}85%{transform:rotate(730deg) translateX(4px)}100%{transform:rotate(720deg)}}
.r-startle{animation:startle .7s}
@keyframes startle{15%{transform:translateY(-36px) scale(.85,1.22)}45%{transform:translateY(0) scale(1.1,.9)}70%{transform:scale(.97,1.03)}}
.r-flip{animation:flip 1s cubic-bezier(.3,.7,.4,1);transform-origin:50% 55%}
@keyframes flip{40%{transform:translateY(-90px) rotate(200deg)}70%{transform:translateY(-40px) rotate(360deg)}85%{transform:translateY(0) rotate(360deg) scale(1.1,.9)}100%{transform:rotate(360deg)}}
.r-dance{animation:dance .6s ease-in-out 4}
@keyframes dance{25%{transform:rotate(-10deg) translateY(-14px)}50%{transform:translateY(0) scale(1.05,.95)}75%{transform:rotate(10deg) translateY(-14px)}}
.r-yawn{animation:yawn 1.6s ease-in-out}
@keyframes yawn{40%{transform:scale(1.05,1.1)}70%{transform:scale(1.03,1.06)}}
.r-wiggle{animation:wiggle .32s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-4deg) scale(1.03,.97)}75%{transform:rotate(4deg) scale(1.03,.97)}}
.pt{position:absolute;pointer-events:none;font-size:1.7rem;line-height:1;animation:ptfloat 1.1s ease-out forwards;text-shadow:0 2px 0 rgba(29,18,48,.5)}
.pt.z{font-size:1.5rem;animation-duration:2.2s}
@keyframes ptfloat{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),-95px) scale(1.15);opacity:0}}
body.playmode .verity{touch-action:none}
.modes{display:flex;background:rgba(0,0,0,.28);border-radius:999px;padding:4px;gap:2px}
.mode{border:0;background:none;padding:6px 16px;border-radius:999px;font-size:1.05rem;cursor:pointer;color:var(--text)}
.mode[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.mode:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.pill.icon{padding:7px 10px;display:flex;align-items:center}
.pill.icon svg{width:24px;height:24px}
.reset-link{background:none;border:0;color:var(--muted);font-size:.95rem;margin:10px auto 0;display:block;cursor:pointer;padding:6px}
.start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(20,10,45,.62);padding-inline:16px;text-align:center}
.start h1{margin:0;font-weight:400;font-size:clamp(2.6rem,11vw,4rem);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.start button{font-size:1.6rem;padding:16px 34px;border:0;border-radius:999px;background:var(--coin);color:var(--ink);box-shadow:0 5px 0 #b88a00;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.verity .bodyg,.start button,.r-wiggle{animation:none}.r-spin,.r-flip,.r-dance,.r-hop{animation-duration:.2s}}
@media (prefers-reduced-motion:reduce){.verity.jump{animation-duration:.2s}.sheet{animation:none}.prop{animation:none}.verity.jump .hatlayer{animation:none}}
</style>

<div class="stage">
  <div class="top">
    <button class="pill icon" id="mute" type="button" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/><path d="M16.5 9 Q19 12 16.5 15 M19 6.5 Q23.5 12 19 17.5"/></svg></button>
    <div class="modes" role="group" aria-label="Mode"><button class="mode" type="button" data-mode="tap" aria-pressed="true">Tap</button><button class="mode" type="button" data-mode="play" aria-pressed="false">Play</button></div>
    <button class="pill shop" id="openShop" type="button">Shop</button>
  </div>
  <div class="score" id="score">
    <div class="num"><svg class="c" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#ffd400" stroke="#b88a00" stroke-width="2"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="#b88a00" stroke-width="1.6"/></svg><span id="num">0</span></div>
    <div class="label" id="perLabel">+1 coin per tap</div>
  </div>
  <div class="play" id="play">
    <div class="ground"></div>
    <div class="shadow" id="shadow"></div>
    <button class="verity" id="verity" type="button" aria-label="Tap"></button>
    <div class="hint" id="hint">Tap Verity!</div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Shop" hidden>
  <div class="sheet-head">
    <h2>Shop</h2>
    <div class="wallet" id="wallet"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-tab="smileys" aria-selected="true">Smileys</button>
    <button class="tab" type="button" role="tab" data-tab="hair" aria-selected="false">Hair</button>
    <button class="tab" type="button" role="tab" data-tab="hats" aria-selected="false">Hats</button>
    <button class="tab" type="button" role="tab" data-tab="masks" aria-selected="false">Masks</button>
  </div>
  <div class="list" id="list"></div>
  <button class="pill close" id="closeShop" type="button">Back to the game</button>
  <button class="reset-link" id="reset" type="button">Start over (erase coins and items)</button>
</div>

<div class="start" id="start">
  <h1>Tap the Verity</h1>
  <button type="button" id="startBtn">Tap to play</button>
</div>

<div class="editor" id="editor" role="dialog" aria-label="Mask Maker" hidden>
  <div class="ed-head">
    <button class="pill" id="edCancel" type="button">Cancel</button>
    <h2>Mask Maker</h2>
    <button class="pill shop" id="edSave" type="button">Save</button>
  </div>
  <div class="cwrap"><div id="edBall"></div><canvas id="cv" width="300" height="300" aria-label="Drawing area"></canvas></div>
  <div class="swatches" id="swatches"></div>
  <div class="tools">
    <button class="tool ic" type="button" data-size="9" aria-label="Thin brush"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></button>
    <button class="tool ic" type="button" data-size="21" aria-label="Medium brush" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5" fill="currentColor" stroke="none"/></svg></button>
    <button class="tool ic" type="button" data-size="42" aria-label="Fat brush"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" fill="currentColor" stroke="none"/></svg></button>
    <button class="tool ic" type="button" id="bucket" aria-label="Paint bucket" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11 L11 5 L18 12 L12 18 Z"/><path d="M5 11 H18"/><path d="M8.5 7.5 L6 5"/><path d="M20 15 C20 15 22 17.6 22 19 A2 2 0 0 1 18 19 C18 17.6 20 15 20 15 Z" fill="currentColor" stroke="none"/></svg></button>
    <button class="tool ic" type="button" id="eraser" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5 L13 5 L20 12 L12.5 19.5 H7.5 Z"/><path d="M8.5 9.5 L15.5 16.5"/><path d="M12.5 19.5 H20.5"/></svg></button>
  </div>
  <div class="tools">
    <button class="tool ic" type="button" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 L4 9 L9 4"/><path d="M4 9 H14.5 A5.5 5.5 0 0 1 14.5 20 H11"/></svg></button>
    <button class="tool ic" type="button" id="clear" aria-label="Clear everything"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 H20"/><path d="M9 7 V4.5 H15 V7"/><path d="M6 7 L7 20 H17 L18 7"/><path d="M10 11 V16 M14 11 V16"/></svg></button>
    <label class="tool ic" for="photo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8 H7 L9 5.5 H15 L17 8 H21 V19 H3 Z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="sr">Use a photo</span></label>
    <input class="sr" type="file" id="photo" accept="image/*">
  </div>
  <p class="ed-msg" id="edMsg">Draw a mask over the face!</p>
</div>

<script>
(function(){
  var INK="#1d1230", S=' stroke="'+INK+'" stroke-width="4" stroke-linejoin="round"';
  var COIN='<svg class="c" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#ffd400" stroke="#b88a00" stroke-width="2"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="#b88a00" stroke-width="1.6"/></svg>';

  // ---------- smileys ----------
  var MODELS=[

  modeBtns.forEach(function(b){b.addEventListener("click",function(){if(mode!==b.dataset.mode){setGameMode(b.dataset.mode);sfx("pop")}})});

  // ---- sound on/off ----
  var muteBtn=document.getElementById("mute");
  var ICON_ON=muteBtn.innerHTML,ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/><path d="M16.5 9.5 L21.5 14.5 M21.5 9.5 L16.5 14.5"/></svg>';
  function drawMute(){muteBtn.innerHTML=st.muted?ICON_OFF:ICON_ON;muteBtn.setAttribute("aria-label",st.muted?"Sound off":"Sound on");muteBtn.setAttribute("aria-pressed",!!st.muted)}
  muteBtn.addEventListener("click",function(){st.muted=!st.muted;if(st.muted)humStop();save();drawMute();sfx("pop")});
  drawMute();

  // ---- start screen (a tap here also switches the tablet's sound on) ----
  var startEl=document.getElementById("start");
  document.getElementById("startBtn").addEventListener("click",function(){
    tone(function(c){if(c.resume)c.resume()});startEl.hidden=true;lastAct=Date.now();react("startle");
  });

  // ---------- shop ----------
  var sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),
      list=document.getElementById("list"),wallet=document.getElementById("wallet"),tab="smileys";
  var PREV="-32 -96 264 304";
  function buyBtn(kind,id,price){return '<button class="act buy" type="button" data-kind="'+kind+'" data-buy="'+id+'"'+(st.coins<price?' disabled':'')+'>'+COIN+price.toLocaleString()+'</button>'}
  function row(on,svg,name,sub,btn){return '<div class="item'+(on?' on':'')+'">'+svg+'<div class="info"><div class="name">'+name+'</div><div class="per">'+sub+'</div></div>'+btn+'</div>'}
  function drawShop(){
    wallet.innerHTML=COIN+st.coins.toLocaleString();
    document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
    var m=cur(),html="";
    if(tab==="smileys"){
      html=MODELS.map(function(x){
        var own=st.owned.indexOf(x.id)>-1,on=st.using===x.id,btn=on?'<button class="act using" type="button" disabled>Using</button>':own?'<button class="act use" type="button" data-kind="smiley" data-use="'+x.id+'">Use</button>':buyBtn("smiley",x.id,x.price);
        return row(on,ballSVG(x,x.id,null,null,PREV),x.name,'<b>+'+x.per+'</b> per tap',btn);
      }).join("");
    } else if(tab==="masks"){
      var wear=function(id,on,owned,price){return on?'<button class="act off" type="button" data-kind="mask" data-off="1">Take off</button>':owned?'<button class="act use" type="button" data-kind="mask" data-use="'+id+'">Wear</button>':buyBtn("mask",id,price)};
      var pencil='<g transform="rotate(35 160 40)"><rect x="150" y="-10" width="20" height="70" rx="3" fill="#ffd400" stroke="'+INK+'" stroke-width="4"/><rect x="150" y="-22" width="20" height="14" rx="3" fill="#ff8fc4" stroke="'+INK+'" stroke-width="4"/><path d="M150 60 L160 82 L170 60Z" fill="#f2d2a9" stroke="'+INK+'" stroke-width="4" stroke-linejoin="round"/></g>';
      var mk=ballSVG(m,"mk",null,null,PREV).replace("</svg>",pencil+"</svg>");
      html=row(false,mk,"Mask Maker",st.maker?"Draw your own mask!":"Unlock to draw your own masks",
        st.maker?'<button class="act use" type="button" data-kind="maker" data-draw="1">Draw</button>':buyBtn("maker","maker",MAKER_PRICE));
      if(customs.length){
        html+='<div class="sub-head">YOUR MASKS</div>';
        html+=customs.map(function(c,i){
          var id="c:"+c.id,on=st.mask===id;
          return '<div class="item'+(on?' on':'')+'">'+ballSVG(m,"cm"+i,st.hair,st.hat,PREV,id)+'<div class="info"><div class="name">My Mask '+(i+1)+'</div><div class="per">Drawn by you</div></div><div class="acts">'+wear(id,on,true,0)+'<button class="act del" type="button" data-kind="cdel" data-id="'+c.id+'">Delete</button></div></div>';
        }).join("");
        html+='<div class="sub-head">SHOP MASKS</div>';
      }
      html+=MASKS.map(function(x){
        var on=st.mask===x.id,own=st.masks.indexOf(x.id)>-1;
        return row(on,ballSVG(m,"pm"+x.id,st.hair,st.hat,PREV,x.id),x.name,on?'Wearing now':'Just for looks',wear(x.id,on,own,x.price));
      }).join("");
    } else {
      var isHair=tab==="hair",items=isHair?HAIRS:HATS,owned=isHair?st.hairs:st.hats,worn=isHair?st.hair:st.hat,kind=isHair?"hair":"hat";
      html=items.map(function(x){
        var own=owned.indexOf(x.id)>-1,on=worn===x.id;
        var btn=on?'<button class="act off" type="button" data-kind="'+kind+'" data-off="1">Take off</button>':own?'<button class="act use" type="button" data-kind="'+kind+'" data-use="'+x.id+'">Wear</button>':buyBtn(kind,x.id,x.price);
        // preview with what you're already wearing, so you can see hats over hair
        var svg=isHair?ballSVG(m,"p"+x.id,x.id,st.hat,PREV,st.mask):ballSVG(m,"p"+x.id,st.hair,x.id,PREV,st.mask);
        return row(on,svg,x.name,on?'Wearing now':'Just for looks',btn);
      }).join("");
    }
    list.innerHTML=html;
  }
  document.querySelector(".tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;tab=b.dataset.tab;drawShop();list.scrollTop=0});
  list.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b||b.disabled)return;
    var kind=b.dataset.kind,buy=b.dataset.buy,use=b.dataset.use,off=b.dataset.off;
    if(kind==="maker"){
      if(buy){if(st.coins<MAKER_PRICE)return;st.coins-=MAKER_PRICE;st.maker=true;chaching();save();drawShop();drawCoins();openEditor();return}
      if(b.dataset.draw){openEditor();return}
      return;
    }
    if(kind==="cdel"){
      if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Sure? Tap again";return}
      var cid=b.dataset.id;customs=customs.filter(function(c){return c.id!==cid});
      try{saveCustoms()}catch(err){}
      if(st.mask==="c:"+cid)st.mask=null;
    } else if(kind==="mask"){
      if(buy){var mk=maskById[buy];if(st.coins<mk.price)return;st.coins-=mk.price;st.masks.push(buy);st.mask=buy;chaching()}
      else if(use)st.mask=use;
      else if(off)st.mask=null;
    } else if(kind==="smiley"){
      if(buy){var m=byId[buy];if(st.coins<m.price)return;st.coins-=m.price;st.owned.push(buy);st.using=buy;chaching()}
      else if(use)st.using=use;
    } else {
      var isHair=kind==="hair",cat=isHair?hairById:hatById,owned=isHair?st.hairs:st.hats;
      if(buy){var it=cat[buy];if(st.coins<it.price)return;st.coins-=it.price;owned.push(buy);isHair?st.hair=buy:st.hat=buy;chaching()}
      else if(use){isHair?st.hair=use:st.hat=use}
      else if(off){isHair?st.hair=null:st.hat=null}
    }
    save();drawShop();drawMain();drawCoins();
  });
  function openShop(){drawShop();sheet.hidden=false;scrim.hidden=false}
  function closeShop(){sheet.hidden=true;scrim.hidden=true}
  document.getElementById("openShop").addEventListener("click",openShop);
  document.getElementById("closeShop").addEventListener("click",closeShop);
  scrim.addEventListener("click",closeShop);

  // ---------- mask maker ----------
  var ed=document.getElementById("editor"),cv=document.getElementById("cv"),cx2=cv.getContext("2d"),
      edBall=document.getElementById("edBall"),edMsg=document.getElementById("edMsg"),
      eraserBtn=document.getElementById("eraser"),cancelBtn=document.getElementById("edCancel");
  var COLORS=["#1d1230","#ffffff","#e0281b","#f07a1c","#ffd400","#2fb85a","#3d9bff","#7b3fe4","#ff5fa2","#8a4b22","#9aa3b5"];
  var pen={color:COLORS[2],size:21,mode:"draw"},undoStack=[],dirty=false,cancelArmed=null;
  var swBox=document.getElementById("swatches");
  swBox.innerHTML=COLORS.map(function(c,i){return '<button class="sw" type="button" style="background:'+c+'" data-c="'+c+'" aria-label="Colour '+(i+1)+'" aria-pressed="'+(c===pen.color)+'"></button>'}).join("");
  swBox.addEventListener("click",function(e){var b=e.target.closest(".sw");if(!b)return;pen.color=b.dataset.c;if(pen.mode==="erase")setMode("draw");
    swBox.querySelectorAll(".sw").forEach(function(s){s.setAttribute("aria-pressed",s===b)})});
  document.querySelectorAll("[data-size]").forEach(function(b){b.addEventListener("click",function(){pen.size=+b.dataset.size;
    document.querySelectorAll("[data-size]").forEach(function(o){o.setAttribute("aria-pressed",o===b)})})});
  var bucketBtn=document.getElementById("bucket");
  function setMode(mode){pen.mode=mode;eraserBtn.setAttribute("aria-pressed",mode==="erase");bucketBtn.setAttribute("aria-pressed",mode==="fill")}
  eraserBtn.addEventListener("click",function(){setMode(pen.mode==="erase"?"draw":"erase")});
  bucketBtn.addEventListener("click",function(){setMode(pen.mode==="fill"?"draw":"fill")});
  // keep everything inside the smiley's circle (ball is r96 at 100,100 = r144 at 150,150 on this canvas; stay just inside the outline)
  var CR=142;
  function clipCircle(){cx2.save();cx2.beginPath();cx2.arc(150,150,CR,0,Math.PI*2);cx2.clip()}
  function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function floodFill(p){
    var x0=Math.floor(p.x),y0=Math.floor(p.y);
    if((x0-150)*(x0-150)+(y0-150)*(y0-150)>CR*CR)return;
    var img=cx2.getImageData(0,0,300,300),d=img.data,W=300,i0=(y0*W+x0)*4;
    var t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=hexRGB(pen.color);
    if(t[3]>250&&Math.abs(t[0]-c[0])+Math.abs(t[1]-c[1])+Math.abs(t[2]-c[2])<6)return;
    function match(i){
      if(t[3]<20)return d[i+3]<110; // empty area: spread over empty and faint edge pixels
      return Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])<110;
    }
    var seen=new Uint8Array(W*300),stack=[x0,y0];
    while(stack.length){
      var y=stack.pop(),x=stack.pop(),k=y*W+x;
      if(x<0||y<0||x>=W||y>=300||seen[k])continue;
      seen[k]=1;
      if((x-150)*(x-150)+(y-150)*(y-150)>CR*CR)continue;
      var i=k*4;if(!match(i))continue;
      d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
      stack.push(x+1,y,x-1,y,x,y+1,x,y-1);
    }
    cx2.putImageData(img,0,0);
  }

  function snapshot(){undoStack.push(cx2.getImageData(0,0,300,300));if(undoStack.length>25)undoStack.shift()}
  document.getElementById("undo").addEventListener("click",function(){var s=undoStack.pop();if(s){cx2.putImageData(s,0,0)}});
  document.getElementById("clear").addEventListener("click",function(){snapshot();cx2.clearRect(0,0,300,300)});

  function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height}}
  var drawing=false,last=null;
  function stroke(a,b){
    clipCircle();
    cx2.globalCompositeOperation=pen.mode==="erase"?"destination-out":"source-over";
    cx2.strokeStyle=pen.color;cx2.fillStyle=pen.color;cx2.lineWidth=pen.size;cx2.lineCap="round";cx2.lineJoin="round";
    if(a.x===b.x&&a.y===b.y){cx2.beginPath();cx2.arc(a.x,a.y,pen.size/2,0,Math.PI*2);cx2.fill()}
    else{cx2.beginPath();cx2.moveTo(a.x,a.y);cx2.lineTo(b.x,b.y);cx2.stroke()}
    cx2.globalCompositeOperation="source-over";
    cx2.restore();
  }
  cv.addEventListener("pointerdown",function(e){e.preventDefault();snapshot();dirty=true;if(pen.mode==="fill"){floodFill(pt(e));return}cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);stroke(last,last)});
  cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pt(e);stroke(last,p);last=p});
  ["pointerup","pointercancel"].forEach(function(t){cv.addEventListener(t,function(){drawing=false})});

  // photo: make white paper see-through, crop to the drawing, fit it over the face
  document.getElementById("photo").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var k=Math.min(1,500/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      var t=document.createElement("canvas");t.width=w;t.height=h;var tc=t.getContext("2d");tc.drawImage(img,0,0,w,h);
      var d=tc.getImageData(0,0,w,h),p=d.data,i,hasAlpha=false;
      for(i=3;i<p.length;i+=4)if(p[i]<250){hasAlpha=true;break}
      if(!hasAlpha){
        for(i=0;i<p.length;i+=4){
          var mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]),lum=(p[i]+p[i+1]+p[i+2])/3;
          if(mx-mn<70){ if(lum>175)p[i+3]=0; else if(lum>135)p[i+3]=Math.round(255*(175-lum)/40); }
        }
        tc.putImageData(d,0,0);
      }
      var x0=w,y0=h,x1=-1,y1=-1;
      for(var y=0;y<h;y++)for(var x=0;x<w;x++)if(p[(y*w+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      if(x1<0){edMsg.textContent="Couldn't find a drawing in that photo. Try dark markers on white paper.";return}
      var bw=x1-x0+1,bh=y1-y0+1,s=Math.min(240/bw,210/bh),dw=bw*s,dh=bh*s;
      snapshot();dirty=true;
      clipCircle();cx2.drawImage(t,x0,y0,bw,bh,150-dw/2,155-dh/2,dw,dh);cx2.restore();
      edMsg.textContent="Photo added! You can draw on it too.";
    };
    img.onerror=function(){URL.revokeObjectURL(url);edMsg.textContent="That picture wouldn't open. Try another one."};
    img.src=url;
  });

  function openEditor(){
    edBall.innerHTML=ballSVG(cur(),"ed",null,null);
    cx2.clearRect(0,0,300,300);undoStack=[];dirty=false;
    edMsg.textContent="Draw a mask over the face!";cancelBtn.textContent="Cancel";
    ed.hidden=false;
  }
  function closeEditor(){ed.hidden=true;clearTimeout(cancelArmed);cancelArmed=null}
  cancelBtn.addEventListener("click",function(){
    if(dirty&&!cancelArmed){cancelBtn.textContent="Throw it away?";cancelArmed=setTimeout(function(){cancelBtn.textContent="Cancel";cancelArmed=null},2500);return}
    closeEditor();
  });
  document.getElementById("edSave").addEventListener("click",function(){
    var d=cx2.getImageData(0,0,300,300).data,empty=true;
    for(var i=3;i<d.length;i+=16)if(d[i]>0){empty=false;break}
    if(empty){edMsg.textContent="Draw something first!";return}
    var c={id:Date.now().toString(36),img:cv.toDataURL("image/png")};
    customs.push(c);
    try{saveCustoms()}catch(err){customs.pop();edMsg.textContent="This tablet is out of space. Delete an old mask first.";return}
    st.mask="c:"+c.id;save();closeEditor();tab="masks";drawShop();drawMain();
  });

  var rb=document.getElementById("reset"),armed=null,RB_LABEL=rb.textContent;
  rb.addEventListener("click",function(){
    if(!armed){rb.textContent="Tap again to erase everything";armed=setTimeout(function(){rb.textContent=RB_LABEL;armed=null},2500);return}
    clearTimeout(armed);armed=null;rb.textContent=RB_LABEL;
    st=fresh();save();drawMain();drawCoins();hint.hidden=false;
  });

  drawMain();drawCoins();
  if(st.coins>0)hint.hidden=true;
})();
</script>

</body></html>
